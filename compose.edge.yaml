# Use only on your own VPS after DNS, APP_ORIGIN and SECURE_COOKIE are configured.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
  web:
    environment:
      # Behind Caddy: trust the client address it writes to X-Forwarded-For. The web port itself
      # is published on 127.0.0.1 only.
      TRUST_PROXY: 'true'
volumes:
  caddy-data:
  caddy-config:
