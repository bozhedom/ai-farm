name: ai-farm
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      POSTGRES_DB: farm
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - farm-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farm -d farm']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    profiles: ['app']
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://farm:${POSTGRES_PASSWORD}@db:5432/farm
      HOST: 0.0.0.0
      PORT: '3000'
      HEALTH_DIRECTORY: /health
    volumes:
      - ./.health:/health:ro
    ports:
      - '127.0.0.1:3210:3000'
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'node --import tsx scripts/migrate.ts && node .output/server/index.mjs']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    profiles: ['app']
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://farm:${POSTGRES_PASSWORD}@db:5432/farm
    depends_on:
      web:
        condition: service_healthy
    command: ['node', '--import', 'tsx', 'worker/index.ts']
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'scripts/worker-health.ts']
      interval: 30s
      timeout: 10s
      retries: 3
  backup:
    image: postgres:17-alpine
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    profiles: ['app']
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HEALTH_DIRECTORY: /health
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./.health:/health
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(find /backups -name "farm-*.dump" -mmin -1500 | wc -l)" -gt 0']
      interval: 60s
      timeout: 5s
      retries: 2
  observer:
    build: .
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    profiles: ['app']
    restart: unless-stopped
    environment:
      HEALTH_DIRECTORY: /health
      READINESS_URL: http://web:3000/api/readiness
    volumes:
      - ./.health:/health
    depends_on:
      web:
        condition: service_healthy
    command: ['node', '--import', 'tsx', 'scripts/observe.ts']
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'scripts/observer-health.ts']
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  farm-db:
