name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: farm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farm -d farm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://farm:test-only-password@localhost:5432/farm_test
      - run: npm run build
