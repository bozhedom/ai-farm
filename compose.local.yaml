# Optional local inference and web search. No cloud account is required.
services:
  ollama:
    image: ollama/ollama@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
    restart: unless-stopped
    cpus: 4
    mem_limit: 6g
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NO_CLOUD: '1'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - farm-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 5s
      retries: 3
  search:
    image: docker.io/searxng/searxng@sha256:bcfaed4091d59f7ce85670bd701a2d0295872196dc19908a3965a8353b149f83
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    environment:
      SEARXNG_SECRET: ${SESSION_SECRET}
    ports:
      - '127.0.0.1:8088:8080'
    volumes:
      - ./deploy/searxng.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    environment:
      OLLAMA_URL: http://ollama:11434
      SEARXNG_URL: http://search:8080
  worker:
    environment:
      OLLAMA_URL: http://ollama:11434
      SEARXNG_URL: http://search:8080
volumes:
  farm-models:
