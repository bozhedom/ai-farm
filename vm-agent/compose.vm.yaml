# Browser VM for AI Farm computer use. Copy the vm-agent/ directory to the separate machine:
#   VM_AGENT_TOKEN=<64 hex chars> docker compose -f compose.vm.yaml up -d --build
# Allow TCP 8787 only from the farm server in the VM firewall (docs/32-computer-use.md).
name: ai-farm-vm-agent
services:
  vm-agent:
    build: .
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      VM_AGENT_TOKEN: ${VM_AGENT_TOKEN:?Set a random token of at least 32 characters}
      VM_AGENT_PORT: '8787'
      VM_AGENT_HOST: 0.0.0.0
      VM_AGENT_PROFILE_DIR: /agent/profile
    # The browser profile (cookies, platform logins the owner made) survives restarts and rebuilds.
    volumes:
      - vm-profile:/agent/profile
    ports:
      - '8787:8787'
    # Chromium needs more shared memory than the Docker default.
    shm_size: 1gb
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vm-profile:
